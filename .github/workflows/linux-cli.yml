name: Linux CLI (x86_64)

on:
  pull_request:
    paths:
      - '.github/workflows/linux-cli.yml'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/build-llama.sh'
      - 'scripts/fetch-vendor.sh'
      - 'scripts/package-linux.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build curl libcurl4-openssl-dev python3 ffmpeg libreoffice-writer
      - name: Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - name: Pinned native libraries
        run: |
          scripts/fetch-vendor.sh
          DIGUP_CPU_ONLY=1 scripts/build-llama.sh
      - name: Build and test
        run: |
          swift build -c release --product digup --static-swift-stdlib
          # Ubuntu 24.04's FFmpeg 6.1 cannot satisfy the existing HEIC and
          # orientation-sensitive TIFF/WebP ImageTests (they require FFmpeg 8.1).
          swift test --skip ImageTests
      - name: Package CLI
        run: |
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')
          scripts/package-linux.sh --version "$version" --no-build
          (cd dist && sha256sum -c SHA256SUMS)
          folder=$(mktemp -d)
          tar -xzf dist/digup-"$version"-linux-x86_64.tar.gz -C "$folder"
          "$folder/digup-$version-linux-x86_64/digup" --help
      - name: CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: digup-linux-cli-x86_64
          path: |
            dist/digup-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
