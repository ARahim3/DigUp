# Builds DigUp's website (website/, `uv run website/build.py`) and publishes it with GitHub Pages: on every push to
# main that changes the site, and after every release, so the changelog, the download buttons and the advisories
# follow by themselves. A pull request that changes the site is built and checked, not published. Also by hand:
# `gh workflow run website.yml`. Needs Settings → Pages → Source set to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  # A release event runs on the release's tag, and Pages publishes only from main: ask for a run on main instead.
  after-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run website.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # each docs page's "Updated" date comes from git
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build and check
        run: uv run website/build.py --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
