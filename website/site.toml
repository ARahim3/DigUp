mac = "yes"
windows = "yes"
linux = "yes"

[[compare]]
what = "Exact words in file names and document text"
mac = "yes"
windows = "yes"
linux = "yes"

[[compare]]
what = "Text inside screenshots and scanned PDF pages"
mac = "Apple's text recognition"
windows = "no"
linux = "no"

[[compare]]
what = "Old Word .doc files, RAW photos, SVG pictures"
mac = "yes"
windows = "no"
linux = "no"

[[compare]]
what = "Code search"
mac = "yes"
windows = "yes"
linux = "yes"

[[compare]]
what = "Where the model runs"
mac = "GPU (Metal)"
windows = "Graphics card (Vulkan) when faster, else processor"
linux = "Graphics card (Vulkan) when faster, else processor"

[[compare]]
what = "Videos and recordings open at the moment in"
mac = "QuickTime Player, IINA"
windows = "VLC, mpv, MPC-HC"
linux = "VLC, mpv"

[[compare]]
what = "PDFs open"
mac = "In Preview, with your words searched"
windows = "At the page in Edge, Chrome, Firefox, Acrobat or SumatraPDF"
linux = "At the page in Evince, Papers, Okular, Firefox or Chrome"

[[compare]]
what = "Updates"
mac = "One click"
windows = "One click"
linux = "One click with the AppImage; the .deb opens the release page"

[[compare]]
what = "Search shortcut"
mac = "⇧⌘Space"
