# Problems people run into, and their fixes. Rendered on docs/troubleshooting/ and searchable from every page.
#
# Each problem: a stable `id` (it's the link people share, so don't change it), the `area` it belongs to, a `title`
# that describes the symptom the way someone would put it, the `platforms` it happens on, and a Markdown `body`
# (what's going on, then what to do). `fixed` says which release fixed it, by system; "next" means the release after
# the current one, and should be replaced with the version once it's out.

