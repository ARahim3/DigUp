<!doctype html>
<!-- DigUp embed widget — a compact search page for hosts that embed it (a Nextcloud app
     page, an Immich workspace panel, a dashboard iframe). Dependency-free vanilla
     HTML/CSS/JS, no build step, same origin as the API, no external URLs — the same UI
     rules as index.html (test_media_ui pins this file too): reuses style.css, its own
     embed.css, its own embed.js.

     Query parameters (all optional):
       token   the read-scope bearer token (docs/API.md "Authentication"): it moves from
               the URL into sessionStorage and the URL line is rewritten, so the secret
               never lands in bookmarks, history, or the host app's logs;
       limit   results per search (1–100, the engine's own cap);
       q       runs this search as soon as the page is ready.
     The host may post {source:"digup-host", theme:"light"|"dark"} to set the theme;
     the widget posts {source:"digup-embed", event:"ready"} once, and answers
     {source:"digup-host", event:"theme"} on request.
     A 401 with a stored token clears it and asks once — the same rule as the full UI. -->
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="none">
  <link rel="icon" href="data:,">
  <title>DigUp — embed</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="embed.css">
</head>
<body class="embed">
  <header class="bar embed-bar">
    <input id="q" type="search" autofocus autocomplete="off" spellcheck="false"
           placeholder="Search your media…" aria-label="Search" aria-describedby="statusline">
    <label class="embed-count" title="Results per search — the engine's own cap is 100">
      <select id="limit" aria-label="Number of results">
        <option value="20">20</option>
        <option value="40" selected>40</option>
        <option value="100">100</option>
      </select>
      results
    </label>
    <span id="activity" class="activity" hidden></span>
  </header>
  <nav class="embed-chips" aria-label="Filters">
    <button class="chip on" data-kind="">All</button>
    <button class="chip" data-kind="image,screenshot">Photos</button>
    <button class="chip" data-kind="video">Videos</button>
    <button class="chip" data-kind="pdf,doc,audio">Docs</button>
    <label class="chip chip-check" title="Only hits that clear the engine's 2.0σ strength gate">
      <input id="strong" type="checkbox"> strong only
    </label>
  </nav>
  <main>
    <p id="statusline" role="status">connecting…</p>
    <ul id="results" class="embed-grid"></ul>
  </main>
  <script src="embed.js"></script>
</body>
</html>
