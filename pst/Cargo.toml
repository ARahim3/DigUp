[package]
name = "digup-pst"
version = "0.1.0"
description = "Outlook mail stored in .pst files, for DigUp's helper: list and read mails without Outlook, open one in Outlook"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# microsoft/outlook-pst-rs with its PR #62 (messages without a subnode tree, ~half of some real PSTs), pinned to that
# PR's commit until it's merged and released upstream; then the crates.io release.
outlook-pst = { git = "https://github.com/Private-Recall/outlook-pst-rs.git", rev = "32e4a88acd76b0bc643f8c475cc36c56a8708b94" }
compressed-rtf = "1"
anyhow = "1"
serde_json = "1"
html2text = "0.17"
encoding_rs = "0.8"
codepage = "0.1"

# Opening a mail in Outlook: its COM automation (classic Outlook only; the new Outlook has none).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole",
    "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
debug = false
